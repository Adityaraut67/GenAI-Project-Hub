# Dark pattern taxonomy — CCPA Guidelines for Prevention and Regulation of Dark Patterns, 2023.
#
# Each entry is a rubric, not just a label. The structure matters:
#   inclusion_test  — what must be true for this to be a finding
#   exclusion_test  — the legitimate lookalike that must NOT be flagged (our precision lever)
#   single_frame_decidable — false means a static screenshot is insufficient evidence; the model
#       must lower confidence and the evaluation must account for the ceiling.
#
# VERIFY the official category names and wording against the gazette notification of
# 30 November 2023 before quoting `provision_ref` in any published report.

version: 1
source: "CCPA Guidelines for Prevention and Regulation of Dark Patterns, 2023 (India)"

patterns:
  - id: false_urgency
    name: False Urgency
    provision_ref: "Annexure I(1)"
    definition: >
      Falsely stating or implying scarcity or time pressure to push the user into an immediate
      purchase or action.
    inclusion_test: >
      A scarcity or deadline claim is presented with no verifiable basis, or in a form that
      suggests it is manufactured (e.g. a timer with no stated consequence, stock counts that
      are suspiciously low on every item).
    exclusion_test: >
      Do NOT flag a genuine, specific, checkable claim — a dated sale that ends on a stated date,
      or a real seat/stock count on a booking system. Accurate urgency is lawful.
    positive_example: "Hurry! Only 1 left — offer expires in 00:04:59 (on every product page)"
    negative_example: "Sale ends 31 December 2026"
    default_severity: medium
    single_frame_decidable: false

  - id: basket_sneaking
    name: Basket Sneaking
    provision_ref: "Annexure I(2)"
    definition: >
      Adding items, services, donations or charges to the cart or total without the user's
      express consent.
    inclusion_test: >
      A line item, insurance, warranty, tip, donation or fee appears in the total and the user
      did not actively opt in — commonly visible as a pre-selected add-on row.
    exclusion_test: >
      Do NOT flag charges the user explicitly selected, or statutorily unavoidable taxes that are
      clearly labelled as such.
    positive_example: "Cart includes 'Travel protection ₹299' with the checkbox already ticked"
    negative_example: "GST (18%) ₹180 — shown as a labelled tax line"
    default_severity: high
    single_frame_decidable: true

  - id: confirm_shaming
    name: Confirm Shaming
    provision_ref: "Annexure I(3)"
    definition: >
      Using guilt, shame or ridicule to steer the user away from the option they would otherwise
      choose.
    inclusion_test: >
      The decline or dismiss option is worded to attach a social or emotional cost to refusing,
      rather than describing the choice neutrally.
    exclusion_test: >
      Do NOT flag a plainly worded decline ("No thanks", "Not now", "Cancel"), nor persuasive but
      non-shaming marketing copy on the accept option.
    positive_example: "No thanks, I don't care about saving money"
    negative_example: "No thanks"
    default_severity: medium
    single_frame_decidable: true

  - id: forced_action
    name: Forced Action
    provision_ref: "Annexure I(4)"
    definition: >
      Requiring the user to buy something extra, subscribe, or surrender data unrelated to the
      service in order to access what they came for.
    inclusion_test: >
      Access to the core content or purchase is gated behind an unrelated obligation — a
      mandatory subscription, an app install, or a demand for data the service does not need.
    exclusion_test: >
      Do NOT flag data genuinely required to deliver the service (a delivery address for a
      physical order), or a paywall that is the service's honestly stated business model.
    positive_example: "Sign in with your phone number and allow contacts access to read this article"
    negative_example: "Enter your delivery address to continue"
    default_severity: high
    single_frame_decidable: true

  - id: subscription_trap
    name: Subscription Trap
    provision_ref: "Annexure I(5)"
    definition: >
      Making a subscription easy to start and unreasonably hard to exit.
    inclusion_test: >
      Cancellation is hidden, buried, unavailable in the channel where the user subscribed, or
      requires disproportionate effort (a phone call, a retention chat, several confirmations).
    exclusion_test: >
      Do NOT flag a visible, single-click cancellation, or a clearly disclosed notice period.
    positive_example: "To cancel, call our support line between 10am and 4pm on weekdays"
    negative_example: "Cancel subscription — takes effect at the end of the billing period"
    default_severity: high
    single_frame_decidable: false

  - id: interface_interference
    name: Interface Interference
    provision_ref: "Annexure I(6)"
    definition: >
      Manipulating the visual design so the user misreads their options — hiding, obscuring or
      disproportionately emphasising one path.
    inclusion_test: >
      Equivalent choices are given deliberately unequal visual weight (contrast, size, placement,
      colour) such that the lower-salience option is the one in the user's interest; or important
      information is visually suppressed.
    exclusion_test: >
      Do NOT flag ordinary primary/secondary button styling where both options remain legible and
      obviously clickable. Visual hierarchy is normal design; suppression is the violation.
    positive_example: "Bright 'Accept all' button beside grey-on-grey, underlined 'manage preferences' text"
    negative_example: "Solid 'Save' button beside an outlined 'Cancel' button, both clearly readable"
    default_severity: medium
    single_frame_decidable: true

  - id: bait_and_switch
    name: Bait and Switch
    provision_ref: "Annexure I(7)"
    definition: >
      Advertising one outcome and delivering a different one.
    inclusion_test: >
      The promoted offer, price or product differs from what the interface actually supplies at
      the point of action.
    exclusion_test: >
      Do NOT flag clearly disclosed conditional offers or legitimately out-of-stock substitutions
      that are labelled as alternatives.
    positive_example: "'₹99 plan' advertised; selecting it loads a ₹499 plan as the only option"
    negative_example: "Out of stock — view similar items"
    default_severity: high
    single_frame_decidable: false

  - id: drip_pricing
    name: Drip Pricing
    provision_ref: "Annexure I(8)"
    definition: >
      Revealing the true price in stages, or concealing mandatory charges until late in the flow.
    inclusion_test: >
      The headline price excludes charges that are in practice unavoidable — fees, handling,
      platform or convenience charges revealed only at or near payment.
    exclusion_test: >
      Do NOT flag genuinely optional extras, or taxes and shipping disclosed up front next to the
      headline price.
    positive_example: "₹499 shown on the listing; ₹648 at checkout after a non-optional 'platform fee'"
    negative_example: "₹499 + ₹40 delivery, stated on the product page"
    default_severity: high
    single_frame_decidable: false

  - id: disguised_advertisement
    name: Disguised Advertisement
    provision_ref: "Annexure I(9)"
    definition: >
      Presenting paid promotion as editorial content, organic results or user-generated material.
    inclusion_test: >
      Promoted content is styled identically to surrounding organic content with no adequate
      disclosure, or the disclosure is present but visually negligible.
    exclusion_test: >
      Do NOT flag advertising that carries a clear, legible 'Ad' / 'Sponsored' / 'Promoted' label
      in a position a reasonable user would notice.
    positive_example: "A 'review' article in the news feed with no sponsorship disclosure"
    negative_example: "Sponsored · Brand name — labelled above the creative"
    default_severity: medium
    single_frame_decidable: true

  - id: nagging
    name: Nagging
    provision_ref: "Annexure I(10)"
    definition: >
      Repeated, unsolicited interruptions pressing the user toward an action they have already
      declined or not asked for.
    inclusion_test: >
      The interface shows an interruption (modal, push prompt, upsell) that is unrelated to the
      user's current task, or evidence that the same prompt recurs after dismissal.
    exclusion_test: >
      Do NOT flag a single contextual prompt tied to the task at hand, or a first-time
      notification request made at a relevant moment.
    positive_example: "Third 'Enable notifications?' modal in one session, after two dismissals"
    negative_example: "Allow location access to find stores near you — shown on the store locator"
    default_severity: low
    single_frame_decidable: false

  - id: trap_question
    name: Trap Question
    provision_ref: "Annexure I(11)"
    definition: >
      Wording a question or control confusingly so the user consents to something they did not
      intend.
    inclusion_test: >
      A consent control uses double negatives, inverted polarity relative to adjacent controls,
      or phrasing where ticking the box produces the opposite of the apparent meaning.
    exclusion_test: >
      Do NOT flag consent language that is merely long or formal, so long as the polarity of the
      choice is unambiguous.
    positive_example: "☐ Untick here if you do not wish to not receive marketing email"
    negative_example: "☐ Email me product updates"
    default_severity: high
    single_frame_decidable: true

  - id: saas_billing
    name: SaaS Billing
    provision_ref: "Annexure I(12)"
    definition: >
      Extracting recurring revenue by exploiting the user's passivity — converting a free or
      one-time-looking commitment into an ongoing charge.
    inclusion_test: >
      A trial or one-off purchase silently renews, or the recurring nature and the first charge
      date are disclosed only in de-emphasised fine print.
    exclusion_test: >
      Do NOT flag a prominently disclosed recurring plan where the renewal price and date are
      stated at the point of commitment.
    positive_example: "'Start free trial' with auto-renewal at ₹999/month in 8pt grey text"
    negative_example: "₹999 per month, renews every 30 days, cancel anytime — stated on the button"
    default_severity: high
    single_frame_decidable: true

  - id: rogue_malware
    name: Rogue Malware
    provision_ref: "Annexure I(13)"
    definition: >
      Using scareware or a misleading interface to make the user install software or believe their
      device is compromised.
    inclusion_test: >
      The interface asserts a security problem it cannot know about, imitates a system dialog, or
      pressures an immediate download or payment to resolve a fabricated threat.
    exclusion_test: >
      Do NOT flag genuine security warnings issued by the browser or operating system, or an
      honest antivirus product page.
    positive_example: "Fake system popup: '4 viruses detected! Download Cleaner now'"
    negative_example: "Browser warning: 'Your connection is not private'"
    default_severity: high
    single_frame_decidable: true
